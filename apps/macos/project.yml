# XcodeGen spec (authoritative). Generate the project before opening Xcode:
#   xcodegen generate --spec apps/macos/project.yml
# The generated Fieldwork.xcodeproj is ignored by git; edit this file instead.
# Pinned tool: XcodeGen 2.46.0 (see scripts/bootstrap-macos.sh).
name: Fieldwork
options:
  minimumXcodeGenVersion: "2.46.0"
  projectFormat: xcode16_0
  bundleIdPrefix: org.fieldwork
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  DrillTiming:
    path: ../../packages/DrillTiming
  DrillCore:
    path: ../../packages/DrillCore
  DrillDocument:
    path: ../../packages/DrillDocument
targets:
  Fieldwork:
    type: application
    platform: macOS
    sources:
      - path: Fieldwork
        type: syncedFolder
        excludes:
          - "Info.plist"
          - "Fieldwork.entitlements"
      # The 3du-converter CLI, staged by scripts/build-converter.sh (run by the
      # build phase below and by scripts/bootstrap-macos.sh), is embedded in
      # Contents/MacOS. Code Sign On Copy re-signs it with the app's identity and
      # keeps the sandbox-inheritance entitlements the script gave it.
      - path: ../../build/converter/3du-converter
        type: file
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      - path: ../../build/converter/3du-converter-build.json
        type: file
        buildPhase: resources
    preBuildScripts:
      - name: Build 3du-converter
        script: exec /bin/sh "$SRCROOT/../../scripts/build-converter.sh" --xcode
        # Cargo decides what is out of date, so the phase always runs (about a
        # second when nothing changed) and declares only its outputs.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/../../build/converter/3du-converter
          - $(SRCROOT)/../../build/converter/3du-converter-build.json
    dependencies:
      - package: DrillTiming
        product: DrillTiming
      - package: DrillCore
        product: DrillCore
      - package: DrillCore
        product: FieldworkTour
      - package: DrillDocument
        product: DrillDocument
      - package: DrillDocument
        product: DrillMedia
      - package: DrillDocument
        product: DrillExport
      - package: DrillDocument
        product: DrillConvert
      - sdk: AVFoundation.framework
      - sdk: PDFKit.framework
    settings:
      base:
        INFOPLIST_FILE: Fieldwork/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fieldwork/Fieldwork.entitlements
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Cargo reads the converter source, ~/.cargo and ~/.rustup, which a
        # sandboxed script phase may not.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  FieldworkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FieldworkTests
        type: syncedFolder
    dependencies:
      - target: Fieldwork
    settings:
      base:
        PRODUCT_NAME: $(TARGET_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(FW_BUNDLE_NAMESPACE).FieldworkTests
        SWIFT_VERSION: "5.0"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Fieldwork.app/Contents/MacOS/Fieldwork
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Fieldwork:
    build:
      targets:
        Fieldwork: all
        FieldworkTests: [test]
    test:
      targets:
        - FieldworkTests
